<section class="narrow">
  <p class="kicker">Mot de passe</p>
  <h1>Le réinitialiser</h1>
  @if (error()) { <p class="alert">{{ error() }}</p> }
  @if (message()) { <p class="ok">{{ message() }}</p> }
  <form class="stack panel" [formGroup]="ask" (ngSubmit)="requestCode()">
    <label>E-mail <input type="email" formControlName="email" /></label>
    <button class="btn" type="submit">Envoyer le code</button>
  </form>
  @if (sent()) {
    <form class="stack panel" [formGroup]="confirm" (ngSubmit)="changePassword()">
      <label>E-mail <input type="email" formControlName="email" /></label>
      <label>Code <input formControlName="code" /></label>
      <label>Nouveau mot de passe <input type="password" formControlName="password" /></label>
      <button class="btn" type="submit">Enregistrer</button>
    </form>
  }
  <a routerLink="/connexion">Retour à la connexion</a>
</section>
