<section class="page-title">
  <p class="kicker">Missions</p>
  <h1>Le travail en cours</h1>
  <p class="lede">Une mission existe seulement après l’acceptation d’un devis.</p>
</section>
<section>
  @if (error()) { <p class="alert">{{ error() }}</p> }
  <div class="cards">
    @for (item of items(); track item.id) {
      <a class="card" [routerLink]="['/missions', item.id]">
        <div class="spread">
          <h3>Mission</h3>
          <span class="badge neutral">{{ statusLabel(item.status) }}</span>
        </div>
        <p class="muted">{{ item.created_at | date: 'd MMM y, HH:mm' }}</p>
      </a>
    } @empty { <p class="muted">Aucune mission.</p> }
  </div>
</section>
