<section class="auth-stage">
  <div class="auth-visual">
    <p>Jefamora</p>
    <h1>Revenez sur vos devis et vos missions.</h1>
    <span>Le paiement reste entre le client et le professionnel.</span>
  </div>
  <div class="auth-panel">
    <section class="auth-card">
      <a class="auth-brand" routerLink="/">
        <span class="mark">J</span>
        <span class="word"><span>Jefa</span><span>mora</span></span>
      </a>
      <div class="auth-tabs">
        <a routerLink="/connexion" routerLinkActive="active" queryParamsHandling="preserve">Connexion</a>
        <a routerLink="/inscription" queryParamsHandling="preserve">Inscription</a>
      </div>
      <form [formGroup]="form" (submit)="submit($event)">
        @if (error()) { <p class="alert">{{ error() }}</p> }
        <label>Email
          <input type="email" formControlName="email" autocomplete="username" placeholder="vous@exemple.com" />
        </label>
        <label>Mot de passe
          <span class="secret">
            <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
            <button type="button" (click)="showPassword.set(!showPassword())">{{ showPassword() ? 'Masquer' : 'Afficher' }}</button>
          </span>
        </label>
        <a class="auth-aside" routerLink="/mot-de-passe">Mot de passe oublié</a>
        <button class="btn auth-submit" type="submit">Se connecter</button>
      </form>
      <a class="auth-back" routerLink="/">Retour à l'accueil</a>
    </section>
  </div>
</section>
